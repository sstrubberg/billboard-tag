name: Refresh chart cache

# What this CAN do: keep the Billboard chart cache current, so any machine
# that clones this repo starts with fresh data instead of a multi-hour scrape.
#
# What this CANNOT do: tag your library. Lexicon's API is on localhost on your
# own machine; a GitHub runner has no route to it. Tagging stays local.

on:
  schedule:
    - cron: "0 8 * * 0"        # Sundays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh bulk datasets
        run: python billboard_tag.py load --refresh

      - name: Fetch new weeks for scrape-only charts
        run: python billboard_tag.py fetch --workers 4 --start-year 2024
        continue-on-error: true

      - name: Report coverage
        run: python cache_audit.py || true

      - name: Commit refreshed cache
        run: |
          # Uncompressed on purpose - git deltas it far better. See README.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add billboard_cache.json billboard_cache.progress.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh chart cache $(date -u +%Y-%m-%d)"
            git push
          fi
